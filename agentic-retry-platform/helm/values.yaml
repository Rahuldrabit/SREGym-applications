namespace: agentic-retry-platform

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379

postgres:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  db: knowledge
  user: agent_user
  password: agent_password

pgbouncer:
  image:
    repository: edoburu/pgbouncer
    tag: "v1.20.1"
    pullPolicy: IfNotPresent
  port: 6432
  poolSize: 25
  maxClientConn: 200

dataApi:
  replicaCount: 2
  port: 8002
  concurrencyLimit: 25
  queueCapacity: 200
  normalLatency: 0.10
  faultLatency: 1.50

toolGateway:
  replicaCount: 2
  port: 8001
  httpTimeout: 0.60
  httpMaxRetries: 2
  toolMaxRetries: 2
  dataApiUrl: "http://data-api:8002/data/query"

agentOrchestrator:
  replicaCount: 2
  port: 8000
  plannerTimeout: 3.50
  plannerMaxRetries: 3
  workflowDeadline: 12.0
  retryBudget: 12
  toolGatewayUrl: "http://tool-gateway:8001/tools/execute"
  redisHost: "redis"
  redisPort: 6379
