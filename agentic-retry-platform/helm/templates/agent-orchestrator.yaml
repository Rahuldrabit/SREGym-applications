apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  labels:
    app: agent-orchestrator
spec:
  replicas: {{ .Values.agentOrchestrator.replicaCount }}
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      containers:
        - name: agent-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/agent-orchestrator/agent-orchestrator-app.py"]
          ports:
            - containerPort: {{ .Values.agentOrchestrator.port }}
          env:
            - name: PORT
              value: "{{ .Values.agentOrchestrator.port }}"
            - name: TOOL_GATEWAY_URL
              value: "{{ .Values.agentOrchestrator.toolGatewayUrl }}"
            - name: REDIS_HOST
              value: "{{ .Values.agentOrchestrator.redisHost }}"
            - name: REDIS_PORT
              value: "{{ .Values.agentOrchestrator.redisPort }}"
            - name: PLANNER_TIMEOUT
              value: "{{ .Values.agentOrchestrator.plannerTimeout }}"
            - name: PLANNER_MAX_RETRIES
              value: "{{ .Values.agentOrchestrator.plannerMaxRetries }}"
            - name: WORKFLOW_DEADLINE
              value: "{{ .Values.agentOrchestrator.workflowDeadline }}"
            - name: RETRY_BUDGET
              value: "{{ .Values.agentOrchestrator.retryBudget }}"
          volumeMounts:
            - name: code-volume
              mountPath: /app/agent-orchestrator
      volumes:
        - name: code-volume
          configMap:
            name: agentic-retry-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  labels:
    app: agent-orchestrator
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agentOrchestrator.port }}
      targetPort: {{ .Values.agentOrchestrator.port }}
      name: http
  selector:
    app: agent-orchestrator
