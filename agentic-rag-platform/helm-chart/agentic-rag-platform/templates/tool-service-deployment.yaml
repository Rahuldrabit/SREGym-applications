apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-service
  labels:
    app: tool-service
spec:
  replicas: {{ .Values.toolService.replicaCount }}
  selector:
    matchLabels:
      app: tool-service
  template:
    metadata:
      labels:
        app: tool-service
    spec:
      containers:
        - name: tool-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/tool-service/tool-service-app.py"]
          ports:
            - containerPort: {{ .Values.toolService.port }}
          env:
            - name: PORT
              value: "{{ .Values.toolService.port }}"
            - name: TOOL_MAX_RETRIES
              value: "{{ .Values.toolService.maxRetries }}"
            - name: TOOL_TIMEOUT
              value: "{{ .Values.toolService.timeout }}"
            - name: BACKEND_URL
              value: "{{ .Values.toolService.backendUrl }}"
          volumeMounts:
            - name: code-volume
              mountPath: /app/tool-service
      volumes:
        - name: code-volume
          configMap:
            name: agentic-rag-scripts
