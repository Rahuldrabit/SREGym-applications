apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/backend/backend-app.py"]
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: CONCURRENCY_LIMIT
              value: "{{ .Values.backend.concurrencyLimit }}"
            - name: NORMAL_LATENCY
              value: "{{ .Values.backend.normalLatency }}"
            - name: FAULT_LATENCY
              value: "{{ .Values.backend.faultLatency }}"
            - name: QUEUE_CAPACITY
              value: "{{ .Values.backend.queueCapacity }}"
          volumeMounts:
            - name: code-volume
              mountPath: /app/backend
      volumes:
        - name: code-volume
          configMap:
            name: agentic-rag-scripts
